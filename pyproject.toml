[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emotionsense"
version = "0.1.0"
description = "EmotionSense AI — Production-Ready Speech Emotion Recognition Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "EmotionSense AI" }]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "soundfile>=0.12",
    "librosa>=0.10",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
# Heavy / plane-specific extras kept separate so local CPU dev stays light.
ml = [
    "xgboost>=2.0",
]
deep = [
    "torch>=2.2",
    "safetensors>=0.4",
]
transformer = [
    "transformers>=4.40",
    "torchaudio>=2.2",
]
backend = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
    "boto3>=1.34",
    "prometheus-client>=0.20",
    "mlflow>=2.12",
]
frontend = [
    "streamlit>=1.33",
    "requests>=2.31",
    "plotly>=5.20",
]
dev = [
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "black>=24.3",
    "mypy>=1.9",
    "pre-commit>=3.7",
    "detect-secrets>=1.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.isort]
known-first-party = ["emotionsense"]

[tool.mypy]
python_version = "3.11"
packages = ["emotionsense"]
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "unit: fast, pure-logic tests",
    "integration: DB/storage/API tests",
    "e2e: full-stack smoke tests",
    "slow: needs network or heavy models (excluded by default)",
]

[tool.coverage.run]
source = ["emotionsense"]
omit = [
    "*/frontend/*",          # Streamlit UI — launched manually, not unit-tested
    "*/__init__.py",
    "*/ml/models/deep.py",   # requires the 'deep' extra (torch) — not in the default test env
    "*/ml/features/ssl.py",  # requires the 'transformer' extra — not in the default test env
]

[tool.coverage.report]
# Coverage gate (design review A1): start at 70, raise toward 80 as the DB-backed
# persistence + remaining API endpoints are implemented and tested.
fail_under = 70
show_missing = true
