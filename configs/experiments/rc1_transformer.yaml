name: rc1-transformer
description: >
  Transformer Phase 1 validation. Frozen Distil-HuBERT embeddings + SVM head vs a classical
  SVM and the majority baseline, speaker-independent 5-fold CV on RAVDESS + the cross-corpus
  RAVDESS->CREMA-D test. Requires the 'transformer' extra.

  The SSL extractor auto-selects CUDA when available (Kaggle/Colab GPU); embeddings are
  cached per clip and reused across folds, so cost is ~one forward pass per unique clip.
  Expect the CREMA-D cross-corpus pass (~7.4k clips) to dominate runtime. Reported metrics
  include Accuracy, macro-F1, weighted-F1, UA (±std), confusion matrix, and extract/train/
  infer timings — identical to the classical rows.
datasets:
  - ravdess
models:
  - baseline_majority
  - svm
  - distilhubert
cross_corpus:
  train: ravdess
  test: crema_d
eval:
  n_folds: 5
  seed: 42
