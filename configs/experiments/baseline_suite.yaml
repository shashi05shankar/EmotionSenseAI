name: baseline-suite
description: >
  Lean Core benchmark: baselines + classical models under speaker-independent 5-fold CV
  on RAVDESS, plus a cross-corpus RAVDESS->CREMA-D generalization test.
datasets:
  - ravdess
models:
  - baseline_majority
  - baseline_random
  - logreg
  - svm
  - random_forest
cross_corpus:
  train: ravdess
  test: crema_d
eval:
  n_folds: 5
  seed: 42
